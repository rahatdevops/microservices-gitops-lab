name: Microservices CI/CD Pipeline


on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'k8s/**'
      - '.github/workflows/ci-cd.yaml'

  workflow_dispatch:

permissions:
  contents: write

env:
  TRIVY_VERSION: "0.70.0"
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-test-scan-deploy:
    name: Test, Scan, Build and Push
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ------------------------------------------
      # 2. Setup Python
      # ------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ------------------------------------------
      # 3. Test User Service
      # ------------------------------------------

      - name: Test User Service
        working-directory: services/user-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pytest -v tests/

      # ------------------------------------------
      # 4. Test Order Service
      # ------------------------------------------

      - name: Test Order Service
        working-directory: services/order-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pytest -v tests/

      # ------------------------------------------
      # 5. Install Trivy with retries
      # ------------------------------------------

      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TRIVY_VERSION}"
          ARCHIVE="trivy_${VERSION}_Linux-64bit.tar.gz"

          BASE_URL="https://github.com/aquasecurity/trivy/releases/download/v${VERSION}"

          mkdir -p "$HOME/.local/bin"
          cd "$RUNNER_TEMP"

          echo "Downloading Trivy ${VERSION}"

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 180 \
            "${BASE_URL}/${ARCHIVE}" \
            -o "$ARCHIVE"

          echo "Downloading Trivy checksums"

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 180 \
            "${BASE_URL}/trivy_${VERSION}_checksums.txt" \
            -o checksums.txt

          echo "Verifying SHA256 checksum"

          EXPECTED_SHA=$(awk -v file="$ARCHIVE" '$2 == file {print $1}' checksums.txt)

          if [ -z "$EXPECTED_SHA" ]; then
            echo "Trivy checksum not found"
            exit 1
          fi

          echo "${EXPECTED_SHA}  ${ARCHIVE}" | sha256sum -c -

          echo "Extracting Trivy"

          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" trivy

          install -m 0755 "$RUNNER_TEMP/trivy" "$HOME/.local/bin/trivy"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/trivy" --version

      # ------------------------------------------
      # 6. Cache Trivy database
      # ------------------------------------------

      - name: Cache Trivy Database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ env.TRIVY_VERSION }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # ------------------------------------------
      # 7. Trivy Filesystem Scan
      # ------------------------------------------

      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --cache-dir "$HOME/.cache/trivy" \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --skip-dirs .git \
            .

      # ------------------------------------------
      # 8. Build User Service Image
      # ------------------------------------------

      - name: Build User Service Image
        run: |
          docker build \
            -t "${DOCKERHUB_USERNAME}/user-service:${GITHUB_SHA}" \
            ./services/user-service

      # ------------------------------------------
      # 9. Build Order Service Image
      # ------------------------------------------

      - name: Build Order Service Image
        run: |
          docker build \
            -t "${DOCKERHUB_USERNAME}/order-service:${GITHUB_SHA}" \
            ./services/order-service

      # ------------------------------------------
      # 10. Trivy User Service Image Scan
      # ------------------------------------------

      - name: Trivy User Service Image Scan
        run: |
          trivy image \
            --cache-dir "$HOME/.cache/trivy" \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${DOCKERHUB_USERNAME}/user-service:${GITHUB_SHA}"

      # ------------------------------------------
      # 11. Trivy Order Service Image Scan
      # ------------------------------------------

      - name: Trivy Order Service Image Scan
        run: |
          trivy image \
            --cache-dir "$HOME/.cache/trivy" \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${DOCKERHUB_USERNAME}/order-service:${GITHUB_SHA}"

      # ------------------------------------------
      # 12. Docker Hub Login
      # ------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------
      # 13. Push User Service Image
      # ------------------------------------------

      - name: Push User Service Image
        run: |
          docker push "${DOCKERHUB_USERNAME}/user-service:${GITHUB_SHA}"

      # ------------------------------------------
      # 14. Push Order Service Image
      # ------------------------------------------

      - name: Push Order Service Image
        run: |
          docker push "${DOCKERHUB_USERNAME}/order-service:${GITHUB_SHA}"

      # ------------------------------------------
      # 15. Update Kubernetes Image Tags
      # ------------------------------------------

      - name: Update Kubernetes Manifests
        run: |
          USER_IMAGE="${DOCKERHUB_USERNAME}/user-service:${GITHUB_SHA}"
          ORDER_IMAGE="${DOCKERHUB_USERNAME}/order-service:${GITHUB_SHA}"

          sed -i -E \
            "s#(^[[:space:]]*image: ).*user-service:[^[:space:]]+#\1${USER_IMAGE}#" \
            k8s/user-service/deployment.yaml

          sed -i -E \
            "s#(^[[:space:]]*image: ).*order-service:[^[:space:]]+#\1${ORDER_IMAGE}#" \
            k8s/order-service/deployment.yaml

          echo "Updated Kubernetes image references:"
          grep -n 'image:' k8s/user-service/deployment.yaml
          grep -n 'image:' k8s/order-service/deployment.yaml

      # ------------------------------------------
      # 16. Commit and Push Manifest Changes
      # ------------------------------------------

      - name: Commit and Push Kubernetes Manifests
        run: |
          git config user.name "rahatdevops"
          git config user.email "saeed_456@outlook.com"

          git add k8s/user-service/deployment.yaml
          git add k8s/order-service/deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes detected"
          else
            git commit -m "[skip ci] chore: update microservices image tags"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
