apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: microservices-app
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/rahatdevops/microservices-gitops-lab.git
    targetRevision: main
    path: k8s

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: microservices

  syncPolicy:

    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
